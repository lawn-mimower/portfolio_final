[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# Form handling: Astro emits static HTML; Netlify auto-detects forms with
# the `data-netlify="true"` attribute on the rendered <form>.

# Security headers. CSP is tuned for the Astro build: self-hosted fonts,
# bundled JS, one inline theme-init script, and inline styles.
# NOTE: intentionally no `upgrade-insecure-requests` and no HSTS — the
# /foresite-redirect page bounces users to an http://<lan>:48317 dashboard,
# and forcing https would break that outbound navigation.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
