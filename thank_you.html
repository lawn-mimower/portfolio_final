<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You! - Mihir Mohite</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        crossorigin="anonymous" />
  <script src="main.js" defer></script>
</head>
<body class="light-theme">
  <header>
    <nav class="navbar" role="navigation">
      <div class="logo">Mihir Mohite<span class="accent-dot">.</span></div>
      <button id="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
    </nav>
  </header>

  <section class="section thank-you-section" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 50px 20px;">
    <div class="thank-you-content" style="max-width: 600px;">
      <div class="thank-you-icon" style="font-size: 5rem; color: var(--accent-color); margin-bottom: 2rem; animation: bounceIn 1s ease;">
        <i class="fas fa-check-circle"></i>
      </div>
      <h1 style="font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-color);">Thank You!</h1>
      <p style="font-size: 1.25rem; color: var(--text-color); opacity: 0.8; margin-bottom: 2rem;">Your message has been successfully sent. I'll get back to you as soon as possible!</p>
      <div class="thank-you-buttons" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="cta-button primary">
          <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="/#contact" class="cta-button secondary">
          <i class="fas fa-envelope"></i> Send Another Message
        </a>
      </div>
      <div class="social-links-large" style="margin-top: 3rem;">
        <a href="https://github.com/lawn-mimower" target="_blank" aria-label="GitHub"><i class="fab fa-github"></i></a>
        <a href="https://in.linkedin.com/in/mihir-mohite-49a08120b" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:mihir.moe@gmail.com" aria-label="Email"><i class="fas fa-envelope"></i></a>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-content">
      <p class="copyright">&copy; 2025 Mihir Mohite. All rights reserved.</p>
    </div>
  </footer>

  <style>
    @keyframes bounceIn {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .social-links-large {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
    }

    .social-links-large a {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: var(--secondary-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--text-color);
      transition: all var(--transition-speed);
      border: 2px solid var(--border-color);
    }

    .social-links-large a:hover {
      background-color: var(--accent-color);
      color: white;
      transform: translateY(-5px);
      border-color: var(--accent-color);
    }
  </style>
</body>
</html>
